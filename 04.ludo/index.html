<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ludo Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Ludo Board</h1>
        <div class="board" role="img" aria-label="Four-color Ludo board. Each corner holds four tokens, and a cross-shaped track connects the corners to the center.">
            <div class="home ruby">
                <div class="tokens">
                    <span></span><span></span>
                    <span></span><span></span>
                </div>
            </div>
            <div class="path vertical jade">
                <span></span><span></span><span></span>
                <span></span><span class="lane"></span><span class="safe">◆</span>
                <span class="safe">◆</span><span class="lane"></span><span></span>
                <span></span><span class="lane"></span><span></span>
                <span></span><span class="lane"></span><span></span>
                <span></span><span class="lane"></span><span></span>
            </div>
            <div class="home jade">
                <div class="tokens">
                    <span></span><span></span>
                    <span></span><span></span>
                </div>
            </div>
            <div class="path horizontal ruby">
                <span></span><span class="safe">◆</span><span></span><span></span><span></span><span></span>
                <span></span><span class="lane"></span><span class="lane"></span><span class="lane"></span><span class="lane"></span><span class="lane"></span>
                <span></span><span></span><span class="safe">◆</span><span></span><span></span><span></span>
            </div>
            <div class="goal">
                <span class="jade"></span>
                <span class="amber"></span>
                <span class="blue"></span>
                <span class="ruby"></span>
            </div>
            <div class="path horizontal amber">
                <span></span><span></span><span></span><span class="safe">◆</span><span></span><span></span>
                <span class="lane"></span><span class="lane"></span><span class="lane"></span><span class="lane"></span><span class="lane"></span><span></span>
                <span></span><span></span><span></span><span></span><span class="safe">◆</span><span></span>
            </div>
            <div class="home blue">
                <div class="tokens">
                    <span></span><span></span>
                    <span></span><span></span>
                </div>
            </div>
            <div class="path vertical blue">
                <span></span><span class="lane"></span><span></span>
                <span></span><span class="lane"></span><span></span>
                <span></span><span class="lane"></span><span></span>
                <span></span><span class="lane"></span><span class="safe">◆</span>
                <span class="safe">◆</span><span class="lane"></span><span></span>
                <span></span><span></span><span></span>
            </div>
            <div class="home amber">
                <div class="tokens">
                    <span></span><span></span>
                    <span></span><span></span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
