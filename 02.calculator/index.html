<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <h1>Calculator</h1>
        <p class="display">7744</p>
        <div class="keypad" role="group" aria-label="Sample keypad">
            <span class="key function">C</span>
            <span class="key function">+/−</span>
            <span class="key function">%</span>
            <span class="key operator">÷</span>
            <span class="key">7</span>
            <span class="key">8</span>
            <span class="key">9</span>
            <span class="key operator">×</span>
            <span class="key">4</span>
            <span class="key">5</span>
            <span class="key">6</span>
            <span class="key operator">−</span>
            <span class="key">1</span>
            <span class="key">2</span>
            <span class="key">3</span>
            <span class="key operator">+</span>
            <span class="key zero">0</span>
            <span class="key">,</span>
            <span class="key operator">=</span>
        </div>
    </main>
</body>
</html>
