<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Spotify — Home</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <a class="skip" href="#main">Skip to content</a>
        <aside class="sidebar" aria-label="Main navigation">
            <a class="brand" href="index.html" aria-label="Spotify home"
                ><img src="assets/Spotify logo.png" alt="Spotify"
            /></a>
            <nav>
                <button class="nav-item active" data-view="Home">
                    <img src="assets/Home.png" alt="" />Home</button
                ><button class="nav-item" id="search-button">
                    <img src="assets/Search.png" alt="" />Search</button
                ><button class="nav-item" data-view="Your Library">
                    <img src="assets/Your library.png" alt="" />Your Library
                </button>
            </nav>
            <div class="collection">
                <button class="nav-item" id="create-playlist">
                    <img src="assets/Create.png" alt="" />Create Playlist</button
                ><button class="nav-item" data-playlist="Liked Songs">
                    <img src="assets/Group 2.png" alt="" />Liked Songs</button
                ><button class="nav-item" data-view="Your Episodes">
                    <img src="assets/your episodes.png" alt="" />Your Episodes
                </button>
            </div>
            <nav class="playlist-list" aria-label="Your playlists">
                <button data-playlist="FAV">FAV</button
                ><button data-playlist="Daily Mix 1">Daily Mix 1</button
                ><button data-playlist="Discover Weekly">Discover Weekly</button
                ><button data-playlist="Malayalam">Malayalam</button
                ><button data-playlist="Dance / Electronic Mix">Dance / Electronic Mix</button
                ><button data-playlist="EDM / Popular">EDM / Popular</button>
            </nav>
            <button class="install" id="install">
                <img src="assets/grommet-icons_install-option.png" alt="" />Install App
            </button>
        </aside>
        <main id="main">
            <header class="topbar">
                <div class="history">
                    <button id="back" aria-label="Go back">‹</button
                    ><button id="forward" aria-label="Go forward" disabled>›</button>
                </div>
                <button
                    class="profile"
                    aria-label="Angel profile"
                    id="profile"
                    aria-expanded="false"
                >
                    <img src="assets/User.png" alt="Angel" />
                </button>
                <div class="profile-menu" hidden>
                    Signed in as Angel<br /><span>Enjoy your music.</span>
                </div>
            </header>
            <div class="content">
                <form role="search" id="search-form" hidden>
                    <label for="search">Search your music</label
                    ><input
                        id="search"
                        type="search"
                        placeholder="What do you want to listen to?"
                        autocomplete="off"
                    />
                </form>
                <section aria-labelledby="greeting">
                    <h1 id="greeting">Good morning</h1>
                    <div class="quick-grid">
                        <button class="quick" data-playlist="Liked Songs">
                            <img src="assets/Liked.png" alt="" /><span>Liked Songs</span>
                        </button>
                        <button class="quick" data-playlist="Neffex Playlist">
                            <img src="assets/image4.png" alt="" /><span>Neffex Playlist</span>
                        </button>
                        <button class="quick" data-playlist="K/ DA">
                            <img src="assets/image3.png" alt="" /><span>K/ DA</span>
                        </button>
                        <button class="quick" data-playlist="Liked Songs" data-cover="image1.png">
                            <img src="assets/image1.png" alt="" /><span>Liked Songs</span>
                        </button>
                        <button class="quick" data-playlist="Dance / Electronic Mix">
                            <img src="assets/image2.png" alt="" /><span
                                >Dance / Electronic<br />Mix</span
                            >
                        </button>
                    </div>
                </section>
                <section class="shows" aria-labelledby="shows-title">
                    <div class="section-heading">
                        <h2 id="shows-title">Shows you might like</h2>
                        <button id="see-all" aria-expanded="false">SEE ALL</button>
                    </div>
                    <div class="show-grid">
                        <button
                            class="show"
                            data-playlist="Weekly Motivation"
                            data-artist="Ben Ina Scott"
                        >
                            <img src="assets/image9.png" alt="Weekly Motivation cover" /><strong
                                >Weekly Motivation</strong
                            ><span>Ben Ina Scott</span>
                        </button>
                        <button
                            class="show"
                            data-playlist="MEDITATION SELF"
                            data-artist="Ibn Hussain Aleen"
                        >
                            <img src="assets/image8.png" alt="Meditation Self cover" /><strong
                                >MEDITATION SELF</strong
                            ><span>Ibn Hussain Aleen</span>
                        </button>
                        <button
                            class="show"
                            data-playlist="Words beyond action"
                            data-artist="Samuel Scott"
                        >
                            <img src="assets/image7.png" alt="Words beyond action cover" /><strong
                                >Words beyond action</strong
                            ><span>Samuel Scott</span>
                        </button>
                        <button
                            class="show"
                            data-playlist="The Alexa Show"
                            data-artist="Adriana Tom"
                        >
                            <img src="assets/image6.png" alt="The Alexa Show cover" /><strong
                                >The Alexa Show</strong
                            ><span>Adriana Tom</span>
                        </button>
                        <button class="show" data-playlist="The Stories of May" data-artist="Levus">
                            <img src="assets/image5.png" alt="The Stories of May cover" /><strong
                                >The Stories of May</strong
                            ><span>Levus</span>
                        </button>
                        <button
                            class="show"
                            data-playlist="Motivation Daily by Martha"
                            data-artist="Geonna Martha"
                        >
                            <img src="assets/image10.png" alt="Motivation Daily cover" /><strong
                                >Motivation Daily by Martha</strong
                            ><span>Geonna Martha</span>
                        </button>
                    </div>
                    <p id="empty" hidden>No matching playlists or shows.</p>
                </section>
            </div>
        </main>
        <footer class="player" aria-label="Music player">
            <div class="player-main">
                <div class="now-playing">
                    <img id="track-cover" src="assets/image11.png" alt="Dreaming On cover" />
                    <div>
                        <strong id="track-title">Dreaming On</strong
                        ><span id="track-artist">NEFFEX</span>
                    </div>
                    <button
                        class="liked"
                        id="like"
                        aria-label="Remove from Liked Songs"
                        aria-pressed="true"
                    >
                        ♥
                    </button>
                </div>
                <div class="transport">
                    <div class="controls">
                        <button id="shuffle" aria-label="Shuffle" aria-pressed="false">⤨</button
                        ><button id="previous" aria-label="Previous track">▮◀</button
                        ><button class="play" id="play" aria-label="Play demo" aria-pressed="false">
                            ▶</button
                        ><button id="next" aria-label="Next track">▶▮</button
                        ><button id="repeat" aria-label="Repeat" aria-pressed="false">↻</button>
                    </div>
                    <div class="timeline">
                        <span id="elapsed">2:11</span
                        ><input
                            id="progress"
                            aria-label="Playback position"
                            type="range"
                            min="0"
                            max="162"
                            value="131"
                        /><span>2:42</span>
                    </div>
                </div>
                <div class="player-options">
                    <button id="queue" aria-label="Show queue">☷</button
                    ><button class="device" id="device" aria-label="Connected device">▱</button
                    ><button id="mute" aria-label="Mute" aria-pressed="false">♬</button
                    ><input
                        id="volume"
                        aria-label="Volume"
                        type="range"
                        min="0"
                        max="100"
                        value="80"
                    /><button id="fullscreen" aria-label="Toggle fullscreen">⛶</button>
                </div>
            </div>
            <div class="device-bar">♬ Listening on ASUS-ROG-G531GT</div>
        </footer>
        <div class="toast" id="status" role="status" aria-live="polite"></div>
    </body>
</html>
