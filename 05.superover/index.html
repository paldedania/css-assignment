<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Over Scoreboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scoreboard">
    <header class="match">
      <h1>Super Over</h1>
      <p>India won by 13 runs</p>
    </header>

    <section class="innings india" aria-labelledby="india-name">
      <div class="summary">
        <h2 id="india-name">India</h2>
        <p class="score">27/0</p>
      </div>
      <h3>Runs by ball</h3>
      <ol class="deliveries">
        <li class="boundary">4</li>
        <li>3</li>
        <li>2</li>
        <li class="boundary">6</li>
        <li class="boundary">6</li>
        <li class="boundary">6</li>
      </ol>
    </section>

    <section class="innings pakistan" aria-labelledby="pakistan-name">
      <div class="summary">
        <h2 id="pakistan-name">Pakistan</h2>
        <p class="score">14/0</p>
      </div>
      <h3>Runs by ball</h3>
      <ol class="deliveries">
        <li>2</li>
        <li class="boundary">4</li>
        <li>0</li>
        <li>3</li>
        <li>1</li>
        <li class="boundary">4</li>
      </ol>
    </section>
  </main>
</body>
</html>
