<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Superwars Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="scoreboard">
        <h1>Superwars Scoreboard</h1>
        <div class="match">
            <section class="team team-blue" aria-labelledby="blue-team">
                <h2 id="blue-team">Blue team</h2>
                <p class="score">5</p>
                <div class="players">
                    <article class="player">
                        <img src="assets/super-1.png" alt="">
                        <h3>Spider-Man</h3>
                        <p>12 points</p>
                    </article>
                    <article class="player">
                        <img src="assets/super-3.png" alt="">
                        <h3>Wonder Woman</h3>
                        <p>30 points</p>
                    </article>
                </div>
            </section>
            <section class="team team-red" aria-labelledby="red-team">
                <h2 id="red-team">Red team</h2>
                <p class="score">0</p>
                <div class="players">
                    <article class="player">
                        <img src="assets/super-2.png" alt="">
                        <h3>Captain America</h3>
                        <p>50 points</p>
                    </article>
                    <article class="player">
                        <img src="assets/super-4.png" alt="">
                        <h3>Gem Woman</h3>
                        <p>12 points</p>
                    </article>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
